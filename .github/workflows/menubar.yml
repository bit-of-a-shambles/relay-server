name: menubar

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "menubar/**"
  pull_request:
    paths:
      - "menubar/**"
  workflow_dispatch: {}

jobs:
  menubar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        working-directory: menubar
        run: xcodegen generate
      - name: Test
        working-directory: menubar
        run: xcodebuild test -project RelayMenuBar.xcodeproj -scheme RelayMenuBar -destination 'platform=macOS'
